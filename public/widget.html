<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* Floating launcher bubble, bottom-right. */
    #jpc-launcher {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #25d366;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 30px;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      z-index: 999998;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }
    #jpc-launcher:hover { transform: scale(1.08); }

    /* Chat window. */
    #jpc-window {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 340px;
      max-width: calc(100vw - 40px);
      height: 480px;
      max-height: calc(100vh - 120px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 999999;
      font-size: 14px;
    }
    #jpc-window.open { display: flex; }

    #jpc-header {
      background: #25d366;
      color: #fff;
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #jpc-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    #jpc-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f5f7f9;
    }
    .jpc-msg {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .jpc-msg.bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e5e8;
      border-bottom-left-radius: 4px;
      color: #222;
    }
    .jpc-msg.user {
      align-self: flex-end;
      background: #25d366;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .jpc-msg a { color: #128c7e; font-weight: 600; }

    /* Input row. */
    #jpc-input-row {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #e2e5e8;
      background: #fff;
    }
    #jpc-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 14px;
      outline: none;
    }
    #jpc-input:focus { border-color: #25d366; }
    #jpc-send {
      border: none;
      background: #25d366;
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      font-size: 18px;
    }
    #jpc-send:disabled { opacity: 0.5; cursor: default; }

    #jpc-typing { color: #888; font-style: italic; padding: 4px 2px; }
  </style>
</head>
<body>
  <button id="jpc-launcher" aria-label="Open chat">💬</button>

  <div id="jpc-window">
    <div id="jpc-header">
      <span>💼 Job Portal Global</span>
      <button id="jpc-close" aria-label="Close chat">×</button>
    </div>

    <div id="jpc-messages">
      <div class="jpc-msg bot">👋 Hi! Ask us about our online jobs, or join our Telegram to get started.</div>
    </div>

    <div id="jpc-typing" style="display:none">typing…</div>

    <div id="jpc-input-row">
      <input id="jpc-input" type="text" placeholder="Type a message…" autocomplete="off" />
      <button id="jpc-send" aria-label="Send">➤</button>
    </div>
  </div>

  <script>
    (function () {
      // --- Elements ---
      var launcher = document.getElementById('jpc-launcher');
      var windowEl = document.getElementById('jpc-window');
      var closeBtn = document.getElementById('jpc-close');
      var messagesEl = document.getElementById('jpc-messages');
      var typingEl = document.getElementById('jpc-typing');
      var inputEl = document.getElementById('jpc-input');
      var sendBtn = document.getElementById('jpc-send');

      // --- Toggle ---
      launcher.addEventListener('click', function () {
        windowEl.classList.add('open');
        inputEl.focus();
      });
      closeBtn.addEventListener('click', function () {
        windowEl.classList.remove('open');
      });

      // --- Render helpers ---
      function addMessage(text, who) {
        var el = document.createElement('div');
        el.className = 'jpc-msg ' + who;
        el.innerHTML = linkify(text); // only our own replies/inputs; text from server is trusted config
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      // Turn https:// links in bot replies into clickable anchors.
      function linkify(text) {
        return String(text).replace(/(https?:\/\/[^\s]+)/g, function (m) {
          return '<a href="' + m + '" target="_blank" rel="noopener noreferrer">' + m + '</a>';
        });
      }

      // --- Send ---
      async function send() {
        var text = inputEl.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        inputEl.value = '';
        sendBtn.disabled = true;
        typingEl.style.display = 'block';
        // Use the same origin the widget was served from (works on localhost
        // and behind the VPS reverse proxy; survives the Shopify iframe embed).
        var apiBase = window.location.origin;
        try {
          var res = await fetch(apiBase + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
          });
          var data = await res.json();
          addMessage(data.reply || 'Sorry, something went wrong. Please try again.', 'bot');
        } catch (err) {
          addMessage('Sorry, I couldn\'t reach the server. Please try again.', 'bot');
        } finally {
          typingEl.style.display = 'none';
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener('click', send);
      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') send();
      });
    })();
  </script>
</body>
</html>
